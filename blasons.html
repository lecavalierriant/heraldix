	<style>
		button {font-size: 20px;}
		div[class]:not(.corps) {display: none;}
		#tous {display: none;}
		img {
			width: 75px;
			height: 87.5px;
			border-radius: 0;
		}
		#description {font-size: 25px}
		#description span {display: inline;}
		span {display: none;}
	</style>
	<script>
		function filtre(élément, classe) {
			if (description.innerHTML == "") {
				tous.style.display = "block";
				tous.animate(
					[
						{outline: "2px dotted red;"},
						{outline: "2px dotted transparent"}
					],
					{duration: 3000}
				);
			}
			description.innerHTML += élément.innerHTML + " ";
			for (aaa of document.querySelectorAll(classes(élément) + classe)) {
				aaa.style.display = "inline-block";
				aaa.animate(
					[
						{outline: "2px dotted red"},
						{outline: "2px dotted transparent"}
					],
					{duration: 3000}
				);
			}
			masquer(élément);
		}
		function classes(élément) {
			let classes = [];
			let elementActuel = élément;
			while (elementActuel) {
				if (elementActuel.className) {classes.unshift("." + elementActuel.className + " > ");}
				elementActuel = elementActuel.parentElement;
			}
			return classes.join("");
		}
		function masquer(bouton) {
			// const boutons = bouton.parentElement.children;

			// 	}
			// );
		}
